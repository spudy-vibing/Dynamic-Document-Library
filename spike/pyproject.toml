[project]
name = "doccode-spike"
version = "0.0.0"
description = "WP-002 throwaway API spike for DocCode. Never merged, never published."
requires-python = ">=3.10"
dependencies = ["jinja2>=3.1", "markdown-it-py>=3.0"]

[project.optional-dependencies]
live = ["anthropic"]  # only for the owner's one live call

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doccode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
