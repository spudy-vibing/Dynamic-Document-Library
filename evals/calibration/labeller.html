<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocCode labelling pack</title>
<!-- Offline labelling page for the DocCode eval judge calibration (WP-018, EVAL-13).
     Generated by `python -m evals label export`; the pack is embedded below. No network access. -->
<style>
  :root { --fg:#1d1d1f; --muted:#6b6b70; --line:#d9d9de; --bg:#fafafa; --card:#fff; --accent:#2b59c3; --ok:#1e7d3a; --warn:#a15c00; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--fg); background:var(--bg); }
  header { position:sticky; top:0; z-index:2; background:var(--card); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; }
  header h1 { font-size:16px; margin:0; }
  header .grow { flex:1; }
  .banner { background:#fff4e0; color:var(--warn); border-bottom:1px solid #f0d8a8; padding:6px 16px; font-size:13px; }
  .wrap { display:grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 60px); }
  nav { border-right:1px solid var(--line); padding:8px; overflow:auto; max-height: calc(100vh - 60px); position:sticky; top:56px; }
  nav button { display:block; width:100%; text-align:left; border:0; background:none; padding:4px 8px; border-radius:6px; cursor:pointer; font:inherit; font-size:13px; color:var(--fg); }
  nav button.cur { background:#e8eefc; }
  nav button.done::after { content:" ✓"; color:var(--ok); }
  main { padding:16px 20px 80px; max-width:1500px; }
  .docs { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .doc { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 16px; overflow:auto; max-height:70vh; }
  .doc h2.lbl { margin:0 0 6px; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .doc table { border-collapse:collapse; font-size:13px; margin:8px 0; }
  .doc td, .doc th { border:1px solid var(--line); padding:3px 6px; }
  pre.raw { white-space:pre-wrap; font:13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; margin:0; }
  details { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin:0 0 12px; }
  details pre { white-space:pre-wrap; font:12.5px/1.4 ui-monospace, Menlo, monospace; }
  summary { cursor:pointer; font-weight:600; }
  .q { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin:12px 0; }
  .q .t { font-weight:600; }
  .q .help { color:var(--muted); font-size:13px; white-space:pre-wrap; }
  .opts { display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; }
  .opts label { border:1px solid var(--line); border-radius:6px; padding:4px 12px; cursor:pointer; user-select:none; }
  .opts input { margin-right:5px; }
  .opts label.sel { border-color:var(--accent); background:#e8eefc; }
  textarea { width:100%; min-height:48px; font:inherit; }
  .bar { display:flex; gap:8px; align-items:center; margin:14px 0; }
  button.b { font:inherit; padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:var(--card); cursor:pointer; }
  button.p { background:var(--accent); border-color:var(--accent); color:#fff; }
  .muted { color:var(--muted); }
  .err { color:#b00020; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } nav { position:static; max-height:none; } .docs { grid-template-columns:1fr; } }
</style>
</head>
<body>
<script type="application/json" id="pack">__PACK_JSON__</script>
<header>
  <h1>Labelling pack <code id="packid"></code></h1>
  <label>Your labeller ID <input id="labeller" size="14" placeholder="e.g. owner"></label>
  <span id="progress" class="muted"></span>
  <span class="grow"></span>
  <label class="muted"><input type="checkbox" id="raw"> show raw Markdown</label>
  <button class="b" id="load">Load labels…</button>
  <input type="file" id="file" accept=".json,application/json" hidden>
  <button class="b p" id="save">Download labels JSON</button>
</header>
<div id="banner" class="banner" hidden></div>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script>
"use strict";
const PACK = JSON.parse(document.getElementById("pack").textContent);
const STORE_KEY = "doccode-labels:" + PACK.pack_id;
const ITEMS = PACK.items;
let state = { labeller: "", labels: {}, cur: 0 };

function load() {
  try { const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); if (s && s.labels) state = Object.assign(state, s); } catch (e) {}
}
function persist() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function inline(s) {
  // Links are shown as text, never as clickable anchors.
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, "$1 ($2)");
}
function md(src) {
  const lines = src.replace(/\r/g, "").split("\n");
  let out = [], para = [], list = null, i = 0;
  const flush = () => {
    if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; }
    if (list) { out.push("</" + list + ">"); list = null; }
  };
  while (i < lines.length) {
    const l = lines[i];
    let m;
    if (!l.trim()) { flush(); i++; continue; }
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { flush(); const n = Math.min(6, m[1].length + 1); out.push(`<h${n}>${inline(m[2])}</h${n}>`); i++; continue; }
    if (/^\s*\|/.test(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
      flush();
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
      let html = "<table><thead><tr>" + cells(l).map(c => `<th>${c}</th>`).join("") + "</tr></thead><tbody>";
      i += 2;
      while (i < lines.length && /^\s*\|/.test(lines[i])) { html += "<tr>" + cells(lines[i]).map(c => `<td>${c}</td>`).join("") + "</tr>"; i++; }
      out.push(html + "</tbody></table>");
      continue;
    }
    if ((m = l.match(/^\s*([-*+]|\d+[.)])\s+(.*)$/))) {
      if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; }
      const kind = /\d/.test(m[1]) ? "ol" : "ul";
      if (list !== kind) { if (list) out.push("</" + list + ">"); out.push("<" + kind + ">"); list = kind; }
      out.push("<li>" + inline(m[2]) + "</li>"); i++; continue;
    }
    if (list) { out.push("</" + list + ">"); list = null; }
    para.push(l.trim()); i++;
  }
  flush();
  return out.join("\n");
}
function docHtml(text) {
  return document.getElementById("raw").checked ? `<pre class="raw">${esc(text)}</pre>` : md(text);
}

function complete(it) {
  const l = state.labels[it.item_id];
  if (!l) return false;
  if (it.kind === "pairwise") return PACK.questions.every(q => l.verdicts && l.verdicts[q.id]);
  return PACK.criteria.every(c => l.scores && l.scores[c.id]);
}
function progress() {
  const done = ITEMS.filter(complete).length;
  document.getElementById("progress").textContent = `${done} / ${ITEMS.length} items labelled`;
}

function renderNav() {
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  let lastKind = null;
  ITEMS.forEach((it, i) => {
    if (it.kind !== lastKind) {
      const h = document.createElement("div");
      h.className = "muted"; h.style.cssText = "font-size:12px;margin:8px 8px 2px;text-transform:uppercase";
      h.textContent = it.kind === "pairwise" ? "Pairs" : "Documents";
      nav.appendChild(h); lastKind = it.kind;
    }
    const b = document.createElement("button");
    b.textContent = `${it.n}. ${it.kind === "pairwise" ? "pair" : "document"}`;
    b.className = (i === state.cur ? "cur " : "") + (complete(it) ? "done" : "");
    b.onclick = () => { state.cur = i; persist(); render(); };
    nav.appendChild(b);
  });
}

function ctxHtml(c) {
  return `<details><summary>Case brief: ${esc(c.title)}</summary>
    <p><b>Purpose:</b> ${esc(c.purpose)}<br><b>Audience:</b> ${esc(c.audience)}<br><b>Style guide:</b> ${esc(c.style)}</p>
    <p><b>Outline</b></p><pre>${esc(c.outline)}</pre>
    <p><b>Data</b></p><pre>${esc(c.data)}</pre>
    <p><b>Attachments</b></p><pre>${esc(c.attachments)}</pre></details>`;
}

function optGroup(name, values, current, help) {
  return `<div class="opts">` + values.map(v =>
    `<label class="${String(current) === String(v) ? "sel" : ""}"><input type="radio" name="${name}" value="${v}" ${String(current) === String(v) ? "checked" : ""}>${v}</label>`
  ).join("") + `</div>` + (help ? `<div class="help">${esc(help)}</div>` : "");
}

function render() {
  const it = ITEMS[state.cur];
  const l = state.labels[it.item_id] || {};
  const c = PACK.contexts[it.context];
  let h = `<div class="bar"><button class="b" id="prev">← Previous</button><b>Item ${it.n} of ${ITEMS.length}</b> <span class="muted">${esc(it.item_id)}</span><button class="b" id="next">Next →</button></div>`;
  h += ctxHtml(c);
  if (it.kind === "pairwise") {
    h += `<details><summary>How to judge pairs</summary><pre>${esc(PACK.rules.pairwise)}</pre></details>`;
    h += `<div class="docs"><div class="doc"><h2 class="lbl">Document A</h2>${docHtml(it.doc_a)}</div><div class="doc"><h2 class="lbl">Document B</h2>${docHtml(it.doc_b)}</div></div>`;
    for (const q of PACK.questions) {
      h += `<div class="q"><div class="t">${esc(q.label)}</div><div class="help">${esc(q.text)}</div>${optGroup("v:" + q.id, ["A", "B", "tie"], (l.verdicts || {})[q.id])}</div>`;
    }
  } else {
    h += `<details><summary>How to score documents</summary><pre>${esc(PACK.rules.absolute)}</pre></details>`;
    h += `<div class="doc"><h2 class="lbl">Document</h2>${docHtml(it.doc)}</div>`;
    for (const cr of PACK.criteria) {
      h += `<div class="q"><div class="t">${esc(cr.title)}</div>${optGroup("s:" + cr.id, [1, 2, 3, 4, 5], (l.scores || {})[cr.id])}<details><summary>Anchors</summary><div class="help">${esc(cr.text)}</div></details></div>`;
    }
  }
  h += `<div class="q"><div class="t">Note (optional)</div><textarea id="note">${esc(l.note || "")}</textarea></div>`;
  h += `<div class="bar"><button class="b" id="prev2">← Previous</button><button class="b p" id="next2">Next →</button></div>`;
  const main = document.getElementById("main");
  main.innerHTML = h;
  main.querySelectorAll("input[type=radio]").forEach(r => r.onchange = () => {
    const [kind, id] = r.name.split(":");
    const cur = state.labels[it.item_id] || { kind: it.kind };
    if (kind === "v") { cur.verdicts = Object.assign({}, cur.verdicts, { [id]: r.value }); }
    else { cur.scores = Object.assign({}, cur.scores, { [id]: Number(r.value) }); }
    state.labels[it.item_id] = cur; persist();
    r.closest(".opts").querySelectorAll("label").forEach(x => x.classList.toggle("sel", x.contains(r)));
    renderNav(); progress();
  });
  document.getElementById("note").oninput = e => {
    const cur = state.labels[it.item_id] || { kind: it.kind };
    cur.note = e.target.value; state.labels[it.item_id] = cur; persist();
  };
  const go = d => { state.cur = Math.max(0, Math.min(ITEMS.length - 1, state.cur + d)); persist(); render(); window.scrollTo(0, 0); };
  ["prev", "prev2"].forEach(id => document.getElementById(id).onclick = () => go(-1));
  ["next", "next2"].forEach(id => document.getElementById(id).onclick = () => go(1));
  renderNav(); progress();
}

function exportLabels() {
  const labeller = document.getElementById("labeller").value.trim();
  if (!/^[A-Za-z0-9_.-]{1,40}$/.test(labeller)) { alert("Enter your labeller ID first (letters, digits, _ . -)."); return; }
  const labels = ITEMS.filter(it => state.labels[it.item_id]).map(it => {
    const l = state.labels[it.item_id];
    const row = { item_id: it.item_id, kind: it.kind, note: l.note || "" };
    if (it.kind === "pairwise") row.verdicts = l.verdicts || {}; else row.scores = l.scores || {};
    return row;
  });
  const missing = ITEMS.filter(it => !complete(it)).length;
  if (missing && !confirm(`${missing} item(s) are not fully labelled. Download anyway?`)) return;
  const body = { format: "doccode-labels/1", pack_id: PACK.pack_id, labeller, saved_at: new Date().toISOString(), labels };
  const blob = new Blob([JSON.stringify(body, null, 2) + "\n"], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `labels-${PACK.pack_id}-${labeller}.json`;
  document.body.appendChild(a); a.click(); a.remove();
}

function importLabels(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const body = JSON.parse(r.result);
      if (body.pack_id !== PACK.pack_id) throw new Error(`these labels are for pack ${body.pack_id}, not ${PACK.pack_id}`);
      state.labels = {};
      for (const l of body.labels || []) state.labels[l.item_id] = l;
      state.labeller = body.labeller || state.labeller;
      document.getElementById("labeller").value = state.labeller;
      persist(); render();
    } catch (e) { alert("Could not load labels: " + e.message); }
  };
  r.readAsText(file);
}

document.getElementById("packid").textContent = PACK.pack_id;
if (PACK.mode !== "live") {
  const b = document.getElementById("banner");
  b.hidden = false;
  b.textContent = `Run mode: ${PACK.mode}. These documents are not real results unless the mode is live; label them only to try the flow.`;
}
load();
const lab = document.getElementById("labeller");
lab.value = state.labeller || "";
lab.oninput = () => { state.labeller = lab.value.trim(); persist(); };
document.getElementById("raw").onchange = render;
document.getElementById("save").onclick = exportLabels;
document.getElementById("load").onclick = () => document.getElementById("file").click();
document.getElementById("file").onchange = e => e.target.files[0] && importLabels(e.target.files[0]);
render();
</script>
</body>
</html>
