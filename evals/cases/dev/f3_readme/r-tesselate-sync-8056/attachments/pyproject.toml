[project]
name = "tesselate-sync"
version = "0.3.5"
description = "Mirror a directory tree to object storage, skipping unchanged files."
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Ama Brennan" }]
dependencies = ["httpx>=0.27", "rich>=13"]

[project.scripts]
tesselatesync = "tesselate_sync.cli:main"
[project.optional-dependencies]
azure = ["azure-storage-blob>=12.19"]
yaml = ["pyyaml>=6.0"]
