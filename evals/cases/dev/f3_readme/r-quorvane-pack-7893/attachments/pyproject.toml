[project]
name = "quorvane-pack"
version = "0.4.9"
description = "Bundle a static site into a single archive with content hashes."
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ines Varga" }]
dependencies = ["httpx>=0.27", "rich>=13"]

[project.scripts]
quorvanepack = "quorvane_pack.cli:main"
[project.optional-dependencies]
azure = ["azure-storage-blob>=12.19"]
s3 = ["boto3>=1.34"]
