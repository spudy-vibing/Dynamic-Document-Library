# Eval configuration (EVAL-12, EVAL-20, EVAL-21). Pinned models and explicit effort.
# Model IDs are allowlisted here by FR-PRV-3; nowhere else under evals/ may hard-code one.

[models]
generator = "claude-sonnet-5-5"   # assumed DEFAULT_MODEL until decision 0005
judge = "claude-opus-5-5"         # never weaker than the generator (EVAL-12)
claims = "claude-sonnet-5-5"      # claim checker (EVALS_PROPOSAL §6.2): a different role, cheap

[effort]                          # always sent explicitly as output_config.effort
generator = "medium"
judge = "medium"
claims = "medium"

[max_tokens]                      # includes adaptive-thinking tokens
generator = 16000
judge = 16000
claims = 16000

# USD per million tokens. Verify against the official pricing page before a live run.
# cache_write is the 5-minute cache-write rate (1.25x input). Verified 2026-10-30 (docs/decisions/0005).
[prices."claude-sonnet-5-5"]
input = 2.00
output = 10.00
cache_read = 0.10                 # 0.05x input; verified in decision 0005
cache_write = 2.50

[prices."claude-opus-5-5"]
input = 4.00
output = 20.00
cache_read = 0.20
cache_write = 5.00

[judge]
version = "j1"                    # bump when the judge model, effort or rubric changes
use_batches = true                # Message Batches API (about 50% cheaper)
pairs = [
    ["b0-oneshot", "b1-parallel"],
    ["b2-chain", "b1-parallel"],
    # Coherence ablation (WP-017, EVAL-4): each prototype against B1 and B0. Judged only
    # when both generators are in the run (`--generators ... p1-frame ...`).
    ["p1-frame", "b1-parallel"],
    ["p1-frame", "b0-oneshot"],
    ["p2-brief", "b1-parallel"],
    ["p2-brief", "b0-oneshot"],
    ["p3-flow", "b1-parallel"],
    ["p3-flow", "b0-oneshot"],
    ["p4-editor", "b1-parallel"],
    ["p4-editor", "b0-oneshot"],
]

[absolute]
# Absolute rubric (EVAL-10): six criteria in three grouped calls on the judge model and effort.
# Its version is judge.version + a hash of the absolute_*.md rubric files: bump judge.version
# when the judge model or effort changes; any rubric edit re-versions it by itself (EVAL-12).
enabled = true
floor = 2                         # a score at or below this is a floor miss (BRD §1.5: <= 5% of docs)

[claims]
# Claim checker (EVAL-11): models.claims at effort.claims, one call per document.
version = "c1"                    # bump when the claims model, effort or checking logic changes
enabled = true

[calibration]
# Judge calibration against human labels (WP-018, EVAL-13, EVALS_PROPOSAL §6.3).
seed = 20261030                   # sampling seed for `label export` (--seed overrides)
pairs = 40                        # pairs per pack, stratified by judge pair, spread over families and cases
documents = 20                    # documents per pack, stratified by generator
allowed_case_sets = ["dev"]       # packs never come from held-out runs (EVALS_PROPOSAL §5.3)
exclude_generators = ["n0-null"]  # the null baseline is a leniency check, not worth human time
min_pairwise_labels = 40          # labelled and judged pairs needed (EVAL-13)
min_absolute_labels = 20          # labelled and judged documents needed (EVAL-13)
recalibration_min_labels = 10     # of each kind, with `calibrate --recalibration` (judge model or rubric changed)
pairwise_agreement = 0.75         # judge vs human majority on non-tie items, per gated question
gated_questions = ["overall"]     # the verdict the win-rate gates use; other questions reported, not gated
absolute_kappa = 0.6              # quadratic-weighted kappa per criterion; below it: reported, not gated
bootstrap_resamples = 10000       # cluster bootstrap over cases for every CI

[run]
case_set = "dev"                  # evals/cases/<case_set>/
reps = 3
max_usd = 15.0                    # the harness refuses to start a run projected above this (EVAL-20)
max_concurrency = 4
refusal_rate_limit = 0.02         # above this, a generator's results are marked not comparable

[projection]
# Pre-run cost projection (EVAL-20). Expected, not worst case: max_tokens is a hard cap
# that real calls rarely approach. The runner refuses runs whose expected cost exceeds
# run.max_usd and prints the worst case (max_tokens on every call) alongside.
output_tokens_per_call = 2500     # generator calls, thinking included
judge_output_tokens = 2000        # per judge call (one order of one pair)
absolute_output_tokens = 1500     # per absolute-rubric call (one criterion group of one document)
claims_output_tokens = 2500       # per claim-check call (one document)
chars_per_token = 4

[grading]
number_tolerance = 0.005          # 0.5% relative (EVAL-22)
ngram = 6                         # cross-section repetition (deliberately not FR-COH-5's 8)
word_tolerance = 0.10             # +/-10% on word limits
