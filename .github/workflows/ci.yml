# Library CI (WP-001; NFR-1, NFR-5, NFR-6, DEVELOPMENT_PLAN §0.7, §6).
# The offline eval job, the import check and the live eval workflows are WP-019's
# (.github/workflows/evals-*.yml). No secrets are used here.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv run ruff check
      - run: uv run ruff format --check

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
      - run: uv run mypy --strict src scripts

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # NFR-1: 3.10-3.14 on Linux; 3.12 on macOS and Windows.
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv run pytest -q --cov --cov-report=term
      - run: uv run python -m doctest scripts/check_ownership.py scripts/traceability.py

  ownership:
    # DEVELOPMENT_PLAN §0.7: a wp/<id>-* PR may touch only its manifest's `owns`.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # The script reads the branch from GITHUB_HEAD_REF and the base from GITHUB_BASE_REF
      # itself, so no event field is interpolated into the shell.
      - run: uv run python scripts/check_ownership.py

  traceability:
    # DEVELOPMENT_PLAN §6: no dangling IDs, every requirement in the plan, completed-wave MUSTs tested.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv run python scripts/traceability.py --write docs/traceability.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traceability
          path: docs/traceability.md
