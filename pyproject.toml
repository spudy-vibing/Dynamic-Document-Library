# DocCode library packaging (WP-001; NFR-1, NFR-2, NFR-4, NFR-5, NFR-6).
# The eval harness has its own project in evals/pyproject.toml and is never a dependency here.

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
# Distribution name per decision 0002 (accepted by the owner): `doccode` is blocked on PyPI by
# the similar name `doc-code`. The import package and the CLI command are `doccode`.
name = "doccode-py"
dynamic = ["version"]
description = "Write documents like code: multi-section LLM documents defined in Python, run as a DAG, rendered through templates."
readme = "README.md"
requires-python = ">=3.10"
# TODO(owner): licence not chosen yet. NFR-4 and DEVELOPMENT_PLAN WP-001 specify MIT; add
# `license = "MIT"`, `license-files = ["LICENSE"]` and a LICENSE file once the owner decides.
authors = [{ name = "Shubham Upadhyay" }]
keywords = ["llm", "documents", "reports", "dag", "templates", "anthropic"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]
# NFR-2: the core runtime dependencies are exactly these. Adding one needs a decision record.
dependencies = [
    "anthropic>=0.79",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "nh3>=0.2.17",
    "typer>=0.12",
    "rich>=13.7",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
pdf = ["weasyprint>=62"]
schema = ["pydantic>=2"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

# The `doccode` console script is added by WP-408 (DEVELOPMENT_PLAN §3, append-only edit),
# when src/doccode/cli/main.py exists.

[project.urls]
Repository = "https://github.com/spudy-vibing/Dynamic-Document-Library"

# `uv run` / `uv sync` install the dev extra by default, so `uv run pytest` works out of the box.
[dependency-groups]
dev = ["doccode-py[dev]"]

[tool.hatch.version]
path = "src/doccode/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/doccode"]

[tool.hatch.build.targets.sdist]
include = ["src/doccode", "tests", "README.md", "CHANGELOG.md", "pyproject.toml"]

# ---------------------------------------------------------------- lint and format (NFR-5)
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests"]
# Only Python: the eval project lints itself, and ruff must never reformat code blocks in the docs.
include = ["*.py", "*.pyi"]
extend-exclude = ["evals", "docs", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "N", "C4", "PIE", "RET"]

[tool.ruff.lint.isort]
known-first-party = ["doccode", "check_ownership", "traceability"]

# ---------------------------------------------------------------- types (NFR-5)
[tool.mypy]
strict = true
warn_unreachable = true
files = ["src", "scripts"]

# ---------------------------------------------------------------- tests (NFR-6)
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "evals/tests"]  # see conftest.py: one suite per environment
pythonpath = ["scripts"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "live: calls a real provider; skipped unless DOCCODE_LIVE_TESTS=1 (NFR-10)",
]
xfail_strict = true

[tool.coverage.run]
source = ["doccode"]
branch = true

[tool.coverage.report]
# NFR-6: >= 80% overall. The >= 90% floor on core/execution/content is checked at each gate.
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
    "^\\s*\\.\\.\\.$",
]
